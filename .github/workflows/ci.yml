name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    name: Server check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
      CLIENT_ORIGIN: http://localhost:5174
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma db push
      - run: find src -name '*.js' -exec node --check {} +
      - name: Boot the API and probe health
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4100/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:4100/api/health
          kill $SERVER_PID
